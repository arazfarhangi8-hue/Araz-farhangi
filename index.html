<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0759c7"><title>Araz Media | سامانه ویدیو و QR</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17243b;background:#f3f7ff}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#064db4,#1687ee);color:white;padding:25px 18px;text-align:center}.top h1{margin:0 0 8px}.wrap{max-width:850px;margin:25px auto;padding:0 14px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #183b7020}.hidden{display:none!important}label{display:block;font-weight:bold;margin:15px 0 7px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border:1px solid #cbd7e8;border-radius:10px}textarea{min-height:95px;resize:vertical}button{border:0;background:#0864ce;color:white;font-weight:bold;cursor:pointer;margin-top:14px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8f1ff;color:#0759c7}.note{color:#63738a;font-size:13px;line-height:1.9}.status{margin-top:12px;line-height:1.8;overflow-wrap:anywhere}.video{width:100%;max-height:65vh;background:#111;border-radius:12px}.qr{display:flex;justify-content:center;margin:18px}.qr img,.qr canvas{max-width:100%;height:auto}.pill{display:inline-block;background:#e8f1ff;color:#0759c7;padding:6px 12px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<header class="top"><h1>🎬 Araz Media</h1><div>آپلود ویدیو، ساخت QR Code و تماشای اختصاصی</div></header>
<main class="wrap">
<section id="loginCard" class="card">
<h2>ورود مدیر سامانه</h2><p class="note">این بخش فقط برای مدیر آپلود است. بینندگان برای تماشای ویدیو نیازی به ورود ندارند.</p>
<label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username" placeholder="ایمیل حساب مجاز">
<label>رمز عبور</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">ورود</button><div id="loginStatus" class="status"></div>
</section>
<section id="uploadCard" class="card hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>آپلود و ساخت QR</h2><button id="logoutBtn" class="secondary" style="width:auto;margin:0">خروج</button></div>
<label>انتخاب فایل ویدیو (صدا داخل خود ویدیو حفظ می‌شود)</label><input id="videoFile" type="file" accept="video/*">
<label>توضیحات (اختیاری)</label><textarea id="description" maxlength="1500" placeholder="اگر توضیحی ندارید، خالی بگذارید."></textarea>
<label>مدت اعتبار QR Code</label><select id="expiry"><option value="forever">همیشه (بدون انقضا)</option><option value="1">۱ روز</option><option value="2">۲ روز</option><option value="3">۳ روز</option><option value="4">۴ روز</option><option value="5">۵ روز</option><option value="6">۶ روز</option><option value="7">۷ روز</option></select>
<button id="uploadBtn">آپلود و ساخت QR Code</button><div id="uploadStatus" class="status"></div>
<div id="qrResult" class="hidden"><h3>QR Code آماده است</h3><div id="qr" class="qr"></div><label>پیوند صفحه تماشا</label><input id="shareUrl" readonly><button id="downloadQr" class="secondary">ذخیره QR به‌صورت عکس</button><p id="expiryText" class="note"></p></div>
</section>
<section id="watchCard" class="card hidden"><span class="pill">صفحه تماشای ویدیو</span><h2 id="watchTitle">ویدیو</h2><video id="player" class="video" controls playsinline></video><p id="watchDescription" style="white-space:pre-wrap;line-height:2"></p><div id="watchStatus" class="status"></div></section>
<footer class="note" style="text-align:center;padding:18px">Araz Media</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script><script src="app.js"></script>
</body></html>
